<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --c1:#00e5ff; --c2:#2979ff; --dim:#0a6a88; --glow:0 0 8px rgba(0,229,255,.7); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(ellipse at 50% 30%, #04163a 0%, #00040d 70%); color: var(--c1);
  font-family: "Share Tech Mono", ui-monospace, monospace; overflow: hidden; }
body::before { content:""; position:fixed; inset:0; pointer-events:none;
  background-image: linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
  background-size: 40px 40px; }
body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,229,255,.05) 3px);
  animation: flicker 6s infinite; }
@keyframes flicker { 0%,100%,92%,94% { opacity:1 } 93% { opacity:.7 } }
#app { position:relative; height:100%; display:grid; grid-template-columns: 1fr 340px; }
#main { display:flex; flex-direction:column; min-height:0; }
header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px;
  border-bottom:1px solid rgba(0,229,255,.3); font-family: Orbitron, sans-serif; letter-spacing:4px; text-shadow: var(--glow); }
#clock { font-size:13px; letter-spacing:1px; color:var(--dim); }
#log { flex:1; overflow-y:auto; padding:14px 20px; font-size:17px; line-height:1.5; }
.you { color:#8fdcff; margin:12px 0 2px; }
.you::before { content:"▸ YOU  "; color:var(--dim); font-size:12px; letter-spacing:2px; }
.jarvis { color:#e9fdff; text-shadow:var(--glow); white-space:pre-wrap; margin:2px 0 14px; }
.jarvis::before { content:"◂ JARVIS  "; color:var(--c1); font-size:12px; letter-spacing:2px; }
#stage { display:flex; flex-direction:column; align-items:center; padding:6px 0 8px; }
#orb { position:relative; width:130px; height:130px; border:0; background:none; cursor:pointer; padding:0; }
#orb .core { position:absolute; inset:34px; border-radius:50%; transition:all .3s;
  background: radial-gradient(circle,#e6fdff,#00e5ff 45%,#0057ff); box-shadow:0 0 30px #00e5ff, 0 0 70px rgba(0,120,255,.6); }
#orb .ring { position:absolute; inset:0; border-radius:50%; border:2px solid transparent;
  border-top-color:var(--c1); border-bottom-color:var(--c2); animation:spin 6s linear infinite; }
#orb .r2 { inset:14px; animation-duration:3.5s; animation-direction:reverse; border-top-color:var(--c2); border-bottom-color:var(--c1); }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.14); } }
#orb.listening .core { animation:pulse 1s infinite; box-shadow:0 0 40px #7ffcff, 0 0 90px #00e5ff; }
#orb.thinking .ring { animation-duration:1s; }
#orb.thinking .r2 { animation-duration:.7s; }
#orb.thinking .core { background: radial-gradient(circle,#fff,#4d8dff 50%,#1b2cff); animation:pulse .5s infinite; }
#orb.speaking .core { background: radial-gradient(circle,#fff,#9ff6ff 45%,#00b7ff); animation:pulse .7s infinite; }
#heard { min-height:1.3em; padding:0 16px; text-align:center; color:#8fdcff; }
#status { font-size:12px; letter-spacing:2px; color:var(--dim); text-align:center; padding:2px 16px; text-transform:uppercase; }
#forget { background:none; border:0; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; }
form { display:flex; gap:8px; padding:0 14px 12px; }
input, select { flex:1; min-width:0; font:inherit; font-size:16px; padding:9px 12px; background:rgba(0,20,50,.7);
  color:var(--c1); border:1px solid var(--dim); border-radius:6px; }
button.btn, form button { font:inherit; font-size:15px; padding:8px 14px; background:rgba(0,40,90,.7); color:var(--c1);
  border:1px solid var(--c1); border-radius:6px; cursor:pointer; box-shadow:var(--glow); }
#side { overflow-y:auto; border-left:1px solid rgba(0,229,255,.3); padding-bottom:10px; }
section { margin:10px; padding:10px; border:1px solid rgba(0,229,255,.35); border-radius:6px;
  background:rgba(0,20,50,.55); box-shadow: inset 0 0 20px rgba(0,120,255,.15), 0 0 12px rgba(0,229,255,.12); }
h3 { margin:0 0 8px; font:500 12px Orbitron, sans-serif; letter-spacing:3px; color:var(--dim); }
#camwrap { display:none; position:relative; aspect-ratio:4/3; margin-bottom:8px; background:#000; border:1px solid var(--dim); overflow:hidden; }
#camwrap.on { display:block; }
#camwrap video, #camwrap canvas { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); object-fit:cover; }
#camwrap video { opacity:.5; filter:hue-rotate(160deg) saturate(1.5) contrast(1.1); }
#pose { font-size:13px; margin-bottom:4px; }
.bar { height:4px; background:rgba(0,229,255,.15); margin-bottom:8px; }
.bar i { display:block; height:100%; width:0; background:var(--c1); box-shadow:var(--glow); }
#stages { display:flex; justify-content:space-between; align-items:center; font:500 12px Orbitron, sans-serif; letter-spacing:2px; }
.st { padding:4px 8px; border:1px solid var(--dim); border-radius:4px; color:var(--dim); }
.st.active { color:#fff; border-color:var(--c1); text-shadow:0 0 10px #00e5ff; box-shadow:var(--glow); }
#metrics { margin-top:8px; font-size:12px; color:#8fdcff; line-height:1.5; }
#act { height:170px; overflow-y:auto; font-size:12px; line-height:1.45; color:#8fdcff; }
#act div span { color:var(--dim); }
@media (max-width:820px) {
  #app { grid-template-columns:1fr; grid-template-rows:1fr auto; }
  #side { max-height:36vh; border-left:0; border-top:1px solid rgba(0,229,255,.3); }
}
</style>
</head>
<body>
<div id="app">
<main id="main">
  <header><span>J.A.R.V.I.S.</span><span id="clock"></span></header>
  <div id="log"></div>
  <div id="stage">
    <button id="orb" aria-label="Talk to Jarvis"><span class="ring"></span><span class="ring r2"></span><span class="core"></span></button>
    <div id="heard"></div>
    <div id="status"></div>
    <button id="forget" type="button">[ new chat ]</button>
  </div>
  <form id="form"><input id="input" placeholder="or type here" autocomplete="off"><button>Send</button></form>
</main>
<aside id="side">
  <section>
    <h3>HAND CONTROL</h3>
    <div id="camwrap"><video id="video" playsinline muted></video><canvas id="canvas"></canvas></div>
    <div id="pose">hands off</div>
    <div class="bar"><i id="posebar"></i></div>
    <button class="btn" id="handbtn" type="button">✋ hands: off</button>
    <div id="metrics" style="margin-top:8px">palm 1s = talk · fist = stop · swipe up/down = scroll</div>
  </section>
  <section>
    <h3>PIPELINE</h3>
    <div id="stages"><span class="st" id="st-listening">HEAR</span>›<span class="st" id="st-thinking">THINK</span>›<span class="st" id="st-speaking">SPEAK</span></div>
    <div id="timing" style="margin-top:8px;font-size:12px;color:#8fdcff">first word: – · first spoken: – · total: –</div>
  </section>
  <section><h3>ACTIVITY</h3><div id="act"></div></section>
  <section id="cadmount"></section>
  <section><h3>VOICE</h3><select id="voiceSel"></select></section>
</aside>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const logEl = $("log"), orb = $("orb"), heardEl = $("heard"), statusEl = $("status");
const form = $("form"), input = $("input"), actEl = $("act"), voiceSel = $("voiceSel");

let state = "idle", notice = "";
let convo = false, isListening = false, rec = null, silentRuns = 0;
let convoGen = 0, pending = 0, streamDone = true, abortCtl = null;
let buf = "", spokenAny = false, voice = null, unlocked = false;
let tSend = 0, tFirstTok = 0, tFirstSpeak = 0;

const labels = { idle: "Tap the orb or hold an open palm", listening: "Listening…",
                 thinking: "Thinking…", speaking: "Speaking · tap to interrupt" };
const sec = (ms) => (ms / 1000).toFixed(1) + "s";

function act(msg) {
  const d = document.createElement("div");
  const t = new Date().toLocaleTimeString([], { hour12: false });
  const s = document.createElement("span");
  s.textContent = t + "  ";
  d.append(s, msg);
  actEl.appendChild(d);
  while (actEl.children.length > 60) actEl.removeChild(actEl.firstChild);
  actEl.scrollTop = actEl.scrollHeight;
}
function setState(s) {
  state = s;
  orb.className = s;
  statusEl.textContent = notice || labels[s];
  for (const k of ["listening", "thinking", "speaking"]) $("st-" + k).classList.toggle("active", s === k);
}
function timing() {
  $("timing").textContent = "first word: " + (tFirstTok ? sec(tFirstTok - tSend) : "–") +
    " · first spoken: " + (tFirstSpeak ? sec(tFirstSpeak - tSend) : "–");
}
setInterval(() => {
  $("clock").textContent = new Date().toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}, 1000);

// ---------- voice (British preferred) ----------
function loadVoices() {
  const all = speechSynthesis.getVoices();
  const en = all.filter(v => /^en/i.test(v.lang));
  const gb = en.filter(v => /^en[-_]GB/i.test(v.lang));
  const list = gb.concat(en.filter(v => !gb.includes(v)));
  voiceSel.replaceChildren(...list.map(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    return o;
  }));
  let saved = null;
  try { saved = localStorage.getItem("jarvisVoice"); } catch (e) {}
  voice = list.find(v => v.name === saved)
       || gb.find(v => /\bmale\b|daniel|arthur|george|oliver|ryan|thomas/i.test(v.name))
       || gb[0] || list[0] || null;
  if (voice) voiceSel.value = voice.name;
  if (list.length && !gb.length) act("No British voice found. Pick one from the voice list.");
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
voiceSel.addEventListener("change", () => {
  voice = speechSynthesis.getVoices().find(v => v.name === voiceSel.value) || voice;
  try { localStorage.setItem("jarvisVoice", voiceSel.value); } catch (e) {}
  act("Voice: " + voiceSel.value);
});

function unlock() {
  if (unlocked) return;
  unlocked = true;
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
}
function addLine(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

// ---------- speaking ----------
function speak(text) {
  text = text.trim();
  if (!text) return;
  const gen = convoGen;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
  u.rate = 1.02;
  u.pitch = 0.9;
  pending++;
  spokenAny = true;
  if (!tFirstSpeak) { tFirstSpeak = performance.now(); timing(); }
  act("speaking: " + text.slice(0, 50));
  setState("speaking");
  let finished = false;
  const done = () => {
    if (finished || gen !== convoGen) return;
    finished = true;
    pending--;
    maybeNext();
  };
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
}
function flushChunks(final) {
  while (true) {
    const min = spokenAny ? 25 : 10;
    let cut = -1;
    for (let i = min; i < buf.length - 1; i++) {
      if (".!?,;:".includes(buf[i]) && /\s/.test(buf[i + 1])) { cut = i + 1; break; }
    }
    if (cut < 0) break;
    speak(buf.slice(0, cut));
    buf = buf.slice(cut);
  }
  if (final && buf.trim()) { speak(buf); buf = ""; }
}
function stopSpeaking() {
  convoGen++;
  pending = 0;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (abortCtl) { abortCtl.abort(); abortCtl = null; }
}
function maybeNext() {
  if (!streamDone || pending > 0 || isListening) return;
  if (convo) setTimeout(() => { if (!isListening && pending <= 0) startListening(); }, 250);
  else setState("idle");
}

// ---------- ask the server ----------
async function send(text) {
  const myGen = convoGen;
  setState("thinking");
  addLine("you", text);
  const jEl = addLine("jarvis", "");
  buf = ""; spokenAny = false; streamDone = false;
  tSend = performance.now(); tFirstTok = tFirstSpeak = 0; timing();
  if (window.jarvisCad) {
    const cadMsg = await window.jarvisCad(text);
    if (cadMsg) {
      jEl.textContent = cadMsg;
      if (myGen !== convoGen) return;
      streamDone = true;
      speak(cadMsg);
      return;
    }
  }
  act("→ sent to Gemma");
  abortCtl = new AbortController();
  let full = "";
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }), signal: abortCtl.signal });
    if (!res.ok) throw new Error("server " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = dec.decode(value, { stream: true });
      if (!tFirstTok) { tFirstTok = performance.now(); act("first word after " + sec(tFirstTok - tSend)); timing(); }
      full += piece; buf += piece;
      jEl.textContent = full;
      logEl.scrollTop = logEl.scrollHeight;
      flushChunks(false);
    }
    flushChunks(true);
    act("reply done in " + sec(performance.now() - tSend) + " (" + full.length + " chars)");
  } catch (err) {
    if (err.name === "AbortError") return;
    jEl.textContent = "(couldn't reach the server)";
    act("error: " + (err.message || err));
  }
  if (myGen !== convoGen) return;
  streamDone = true;
  maybeNext();
}

// ---------- listening ----------
function startListening() {
  if (isListening) return;
  if (!SR) { notice = "No speech input here. Use Chrome, or type."; convo = false; setState("idle"); return; }
  notice = "";
  isListening = true;
  heardEl.textContent = "";
  let finalText = "", lastHeard = "";
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    let f = "", i2 = "";
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) f += r[0].transcript; else i2 += r[0].transcript;
    }
    finalText = f;
    lastHeard = f + i2;
    heardEl.textContent = lastHeard;
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { notice = "Mic blocked. Allow it for this site."; convo = false; }
    else if (e.error === "network") { notice = "Speech service unreachable."; convo = false; }
    act("mic: " + e.error);
  };
  rec.onend = () => {
    isListening = false;
    const text = (finalText || lastHeard).trim();
    if (!convo) { setState("idle"); return; }
    if (text) { silentRuns = 0; heardEl.textContent = ""; act("heard: “" + text + "”"); send(text); }
    else if (++silentRuns >= 2) { convo = false; act("heard nothing, going idle"); setState("idle"); }
    else startListening();
  };
  setState("listening");
  try { rec.start(); } catch (err) { isListening = false; setState("idle"); }
}
function startTalking(src) {
  unlock();
  if (state !== "idle") return;
  convo = true; silentRuns = 0;
  act(src + " → listening");
  startListening();
}
function stopAll(src) {
  convo = false;
  stopSpeaking();
  try { rec && rec.abort(); } catch (e) {}
  isListening = false; streamDone = true; notice = "";
  setState("idle");
  act(src + " → stopped");
}

orb.addEventListener("click", () => {
  unlock();
  if (state === "idle") startTalking("tap");
  else if (state === "listening") stopAll("tap");
  else { stopSpeaking(); convo = true; silentRuns = 0; act("tap → interrupted"); startListening(); }
});
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  unlock(); stopSpeaking(); convo = false;
  send(text);
});
$("forget").addEventListener("click", () => {
  fetch("/forget", { method: "POST" });
  logEl.replaceChildren();
  act("new chat");
});

// ---------- hand control (runs in the browser) ----------
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const EDGES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const video = $("video"), canvas = $("canvas"), g = canvas.getContext("2d");
let handsOn = false, landmarker = null, camStream = null;
let lastVid = -1, lastRun = 0, frames = 0, fpsT = performance.now(), fps = 0;
let pose = "none", poseSince = 0, firedPose = null, lastFire = 0, lastSwipe = 0;
const hist = [];

async function toggleHands() {
  unlock();
  const btn = $("handbtn");
  if (handsOn) {
    handsOn = false;
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    $("camwrap").classList.remove("on");
    btn.textContent = "✋ hands: off";
    $("pose").textContent = "hands off";
    act("hand control off");
    return;
  }
  btn.disabled = true;
  act("loading hand tracking…");
  try {
    const { FilesetResolver, HandLandmarker } = await import(MP + "/vision_bundle.mjs");
    const fileset = await FilesetResolver.forVisionTasks(MP + "/wasm");
    const opts = (d) => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numHands: 1 });
    try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); act("hand tracking on GPU"); }
    catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); act("hand tracking on CPU"); }
    camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: "user" }, audio: false });
    video.srcObject = camStream;
    await video.play();
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    $("camwrap").classList.add("on");
    handsOn = true;
    btn.textContent = "✋ hands: on";
    requestAnimationFrame(handLoop);
  } catch (err) {
    act("hands failed: " + (err.message || err));
  }
  btn.disabled = false;
}
$("handbtn").addEventListener("click", toggleHands);

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function fingersUp(lm) {
  return [[8, 6], [12, 10], [16, 14], [20, 18]].filter(([t, p]) => dist(lm[t], lm[0]) > dist(lm[p], lm[0]) * 1.15).length;
}
function drawHand(lm) {
  const w = canvas.width, h = canvas.height;
  g.clearRect(0, 0, w, h);
  if (!lm) return;
  g.strokeStyle = "#00e5ff"; g.lineWidth = 2; g.shadowColor = "#00e5ff"; g.shadowBlur = 8;
  for (const [a, b] of EDGES) { g.beginPath(); g.moveTo(lm[a].x * w, lm[a].y * h); g.lineTo(lm[b].x * w, lm[b].y * h); g.stroke(); }
  g.fillStyle = "#fff";
  for (const p of lm) { g.beginPath(); g.arc(p.x * w, p.y * h, 3, 0, 6.283); g.fill(); }
}
function fire(name) { lastFire = performance.now(); firedPose = name; }

function gestures(lm, now) {
  if (!lm) {
    pose = "none"; firedPose = null; hist.length = 0;
    $("pose").textContent = "no hand · " + fps + " fps";
    $("posebar").style.width = "0";
    return;
  }
  const n = fingersUp(lm);
  const p = n === 4 ? "palm" : n === 0 ? "fist" : "other";
  if (p !== pose) { pose = p; poseSince = now; firedPose = null; }
  const held = now - poseSince;

  hist.push({ t: now, x: lm[9].x, y: lm[9].y });
  while (hist.length && now - hist[0].t > 350) hist.shift();
  const first = hist[0], last = hist[hist.length - 1];
  const dy = last.y - first.y;
  const moved = dist(first, last);

  const need = pose === "palm" ? 1000 : pose === "fist" ? 450 : 1;
  $("pose").textContent = "hand: " + pose + " · " + fps + " fps";
  $("posebar").style.width = (pose === "other" ? 0 : Math.min(100, held / need * 100)) + "%";

  const dx = last.x - first.x;
  if (pose === "palm" && now - lastSwipe > 700 && Math.abs(dx) > 0.3 && Math.abs(dx) > Math.abs(dy) * 1.5 && hist.length > 3 && window.jarvisSwipe) {
    lastSwipe = now;
    fire("palm");
    window.jarvisSwipe(dx);
    act("swipe " + (dx < 0 ? "right" : "left") + " → rotate model");
    return;
  }
  if (pose === "palm" && now - lastSwipe > 700 && Math.abs(dy) > 0.3 && hist.length > 3) {
    lastSwipe = now;
    fire("palm");
    logEl.scrollBy({ top: dy < 0 ? 260 : -260, behavior: "smooth" });
    act("swipe " + (dy < 0 ? "up" : "down") + " → scroll");
    return;
  }
  if (now - lastFire < 1500 || firedPose === pose) return;
  if (pose === "palm" && held > 1000 && moved < 0.08 && state === "idle") { fire("palm"); startTalking("open palm"); }
  else if (pose === "fist" && held > 450 && state !== "idle") { fire("fist"); stopAll("fist"); }
}

function handLoop(now) {
  if (!handsOn) return;
  requestAnimationFrame(handLoop);
  if (now - lastRun < 45 || video.currentTime === lastVid) return;
  lastVid = video.currentTime;
  lastRun = now;
  try {
    const res = landmarker.detectForVideo(video, performance.now());
    const lm = res.landmarks && res.landmarks[0];
    drawHand(lm);
    frames++;
    if (now - fpsT > 1000) { fps = frames; frames = 0; fpsT = now; }
    gestures(lm, now);
  } catch (err) {
    handsOn = false;
    act("hand tracking error: " + (err.message || err));
  }
}

setState("idle");
timing();
window.jarvisAct = act;
act("ready · click ✋ hands to turn on hand control");
</script>
